<!DOCTYPE html>
<html>

<head>
  <title>Koekirjasto</title>
</head>

<body>
  <h1>Tervetuloa koekirjastoon!</h1>
  {% if session.username %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}
  </p>
  {% endif %}

  <p>
    <a href="/login">Kirjaudu sisään</a>
    <a href="/register">Luo tunnus</a>
    <a href="/logout">Kirjaudu ulos</a>
  </p>

  <p>
    <a href="/new_test">Lisää uusi koe</a>

  </p>

  <h2> Lista kokeista:</h2>

  <ul>
    {% for test in tests %}
    <li><a href="/test/{{ test.id }}">{{ test.aine, test.aihe, test.vuosi }}</a></li>
    {% endfor %}
  </ul>
</body>

</html>
