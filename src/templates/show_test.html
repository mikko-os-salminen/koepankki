<!DOCTYPE html>

    <a href="/edit_test/{{ test.id }}">Muokkaa</a>

  {% endif %}

  <h2>Kokeen tiedot:</h2>
  <p>
    Kokeen pitäjä: {{ test.username }}

  <p>
  <p>
    Aihe: {{ test.aihe }}

  <p>
    Vuosi: {{ test.vuosi }}
  <p>
  <p>
    {{ test.koe }}

  <p>
    <a href="/">Palaa etusivulle</a>
  <p>
</body>

</html>
