<!DOCTYPE html>
<html>

<head>
  <title>Kokeen muokkaus</title>
</head>

<body>
  {% if error %}
  <p>{{ error }}</p>
  {% endif %}
  <h2>Muokkaa koetta:</h2>
  <form action="/update_test" method="post">
    <p>
      Aine: <br />

      <select name="aine" required>
      {% for s in ["Kemia", "Matematiikka", "Fysiikka"] %}
        <option value="{{ s }}" {% if s == test.aine %}selected{% endif %}>
        {{ s }}
        </option>
      {% endfor %}
      </select>

    </p>
    <p>
      Aihe: <br />
      <input type="text" name="aihe" value="{{ test.aihe }}"/>
    </p>
    <p>
      Vuosi: <br />
      <select name="vuosi" required>
      {% for y in [2026, 2025, 2024] %}
        <option value="{{ y }}" {% if y == test.vuosi %}selected{% endif %}>
        {{ y }}
        </option>
      {% endfor %}
      </select>
    </p>
    <p>
      Koe: <br />
      <textarea name="koe" rows="16" cols="60">{{ test.koe }}</textarea>
    </p>
    <input type="hidden" name="test_id" value="{{ test.id }}" />
    <input type="submit" value="Päivitä koetta" />
  </form>
  <p>
    <a href="/">Palaa etusivulle</a>
  </p>  
</body>

</html>
