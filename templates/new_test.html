<!DOCTYPE html>
<html>

<head>
  <title>Uusi koe</title>
</head>

<body>
  {% if error %}
  <p>{{ error }}</p>
  {% endif %}
  <h2>Lisää uusi koe:</h2>
  <form action="/create_test" method="post">
    <p>
      Aine: <br />
      <select name="aine" required>
        <option value="" disabled selected>Valitse aine</option>
        <option value="Fysiikka">Fysiikka</option>
        <option value="Kemia">Kemia</option>
        <option value="Matematiikka">Matematiikka</option>
      </select>
    </p>
    <p>
      Aihe: <br />
      <input type="text" name="aihe" />
    </p>
    <p>
      Vuosi: <br />
      <select name="vuosi" required>
        <option value="" disabled selected>Valitse vuosi</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>  
    </p>
    <p>
      Koe: <br />
      <textarea name="koe" rows="16" cols="60"></textarea>
    </p>
    <input type="submit" value="Tallenna koe" />
  </form>
  <p>
    <a href="/">Palaa etusivulle</a>
  </p>
</body>

</html>
